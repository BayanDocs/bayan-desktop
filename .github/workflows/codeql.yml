# Scans this repository with CodeQL, GitHub's static analysis, on every pull request, in the merge queue, on pushes to main and weekly, and uploads the results to GitHub code scanning (work packages X-002 and X-004). Alerts appear under Security → Code scanning, and a pull request shows the ones it would add.
# Languages: GitHub Actions (the workflows), Python (scripts/, tests/ and the checks in .github/) and C++ (the app and its tests). The QML files are not scanned: CodeQL has no QML support.
# C++ is analyzed while it is compiled, so the C++ analysis job, which like every analysis job here holds no write permission, builds the app with the same steps as ci.yml's Linux job: in a container from the base image of deps/ubuntu-packages.lock, with the Ubuntu packages that lock lists (scripts/ubuntu-packages.sh fetches each file from the cache or a download, checks it against the lock's size and SHA-256, and installs them with dpkg; only runs on main save the cache, before anything is installed), the Qt release-age check before anything of Qt runs, scripts/dev-setup.sh for the hash-pinned CMake, Ninja and Qt, and the `ci` preset (the build only; the tests run in ci.yml). It uses the container's Python 3, Ubuntu 24.04's (3.11 or newer is enough for scripts/dev-setup.sh), so nothing is downloaded that is not checked against a hash.
# Each language has two jobs, so that no job that runs CodeQL, or code of this repository, of its tools or of its dependencies, holds a token that can write (X-004; AGENTS.md, workflow conventions). "CodeQL analysis (<language>)" analyses with read permissions only and keeps its results, one SARIF file, as a workflow artifact for a day. "CodeQL (<language>)", the check that main's ruleset requires, holds security-events: write and, after a first step that fails unless its analysis succeeded, runs only GitHub's own actions: it checks out the repository without credentials, downloads that file and uploads it to code scanning. It runs even when its analysis failed, so that the check fails instead of being skipped, which GitHub would count as passed. The upload jobs keep the ids of the jobs that analysed and uploaded before X-004 (analyze for the matrix), because code scanning tells its configurations apart by the workflow, the job id, the matrix and the category: with new ids, it would see new configurations, and the old ones would stay behind on main with their alerts.
# CodeQL's engine, the CodeQL bundle, is downloaded by this workflow and checked against the SHA-256 that its release publishes, then handed to the CodeQL action, which would otherwise download it without checking a hash. Keep CODEQL_VERSION equal to the bundle that the pinned github/codeql-action names in its src/defaults.json (version 4.38.3 names 2.27.2), and update both together in the monthly dependency session, in all five BayanDocs repositories.
# Workflow conventions (AGENTS.md): GitHub's own actions only, pinned to full commit SHAs with the version in a comment; per-job permissions; no credentials kept after checkout; timeouts; the pull_request and merge_group triggers (never pull_request_target).
name: CodeQL

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 2"
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  # Only a newer push to the same pull request cancels a run; the weekly run never cancels a run for a push to main, or the other way round.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The CodeQL bundle 2.27.2 (codeql-bundle-v2.27.2, published 2026-10-06). The SHA-256 is the one in the release's codeql-bundle-linux64.tar.zst.checksum.txt.
  CODEQL_VERSION: 2.27.2
  CODEQL_BUNDLE_SHA256: f24406b1557c506133db1f972758ee64f14eb3587a53367a1bd737f24495ea97

jobs:
  analysis:
    name: CodeQL analysis (${{ matrix.language }})
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # check out the repository
      security-events: read # CodeQL reads its feature flags and sends its status reports through code scanning's API; without this it would analyse with other defaults than the ones GitHub sets
    # One output per language, set by the last step: the result of a matrix job covers all its languages, so each upload job reads its own language's output instead.
    outputs:
      actions: ${{ steps.succeeded.outputs.actions }}
      python: ${{ steps.succeeded.outputs.python }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the CodeQL bundle (pinned version, SHA-256 checked)
        run: |
          bundle="$RUNNER_TEMP/codeql-bundle-linux64.tar.zst"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 --output "$bundle" \
            "https://github.com/github/codeql-action/releases/download/codeql-bundle-v$CODEQL_VERSION/codeql-bundle-linux64.tar.zst"
          echo "$CODEQL_BUNDLE_SHA256  $bundle" | sha256sum --check --strict

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          tools: ${{ runner.temp }}/codeql-bundle-linux64.tar.zst

      # Instead of uploading, the analysis writes the results as CodeQL would upload them (post-processed: matched to the pull request's changes, fingerprinted and given their category) to codeql-sarif/upload.sarif. It does not upload the CodeQL database either, which CodeQL does on main and which needs the write permission too.
      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
          upload: never
          post-processed-sarif-path: ${{ runner.temp }}/codeql-sarif
          upload-database: false

      # Only the SARIF file, kept for a day. Like every artifact of a public repository, anyone signed in to GitHub can download it; everything it is computed from (the code, the queries and the pinned bundle) is public too.
      - name: Keep the results for the upload job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: ${{ runner.temp }}/codeql-sarif/upload.sarif
          if-no-files-found: error
          retention-days: 1

      - name: Record that this analysis succeeded
        id: succeeded
        env:
          LANGUAGE: ${{ matrix.language }}
        run: echo "$LANGUAGE=true" >> "$GITHUB_OUTPUT"

  analyze:
    name: CodeQL (${{ matrix.language }})
    needs: analysis
    # Also when an analysis failed: the first step then fails, so that the required check fails instead of being skipped.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the repository, which the upload uses to match the results to its files
      security-events: write # upload the results to code scanning
    defaults:
      run:
        shell: bash
    steps:
      - name: Stop unless the analysis of this language succeeded
        env:
          LANGUAGE: ${{ matrix.language }}
          SUCCEEDED: ${{ needs.analysis.outputs[matrix.language] }}
        run: |
          if [ "$SUCCEEDED" != true ]; then
            echo "::error::The job \"CodeQL analysis ($LANGUAGE)\" did not succeed, so there are no results to upload."
            exit 1
          fi

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: ${{ runner.temp }}/codeql-sarif

      # Exactly one file: with several, upload-sarif would download the CodeQL bundle, without checking its hash, and run it to merge them.
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ runner.temp }}/codeql-sarif/upload.sarif
          category: /language:${{ matrix.language }}

  cpp-analysis:
    name: CodeQL analysis (c-cpp)
    runs-on: ubuntu-24.04
    # A container from the base image of deps/ubuntu-packages.lock (tests/ubuntu-packages/test_lock.py keeps them equal), as in ci.yml's Linux jobs.
    container:
      image: docker.io/library/buildpack-deps:noble-scm@sha256:94ed690dd634b8b2f531eaa742fde9b1264077cd8ea695a3b960bd104ae4c481 # created 2026-10-26T23:50:00Z
    timeout-minutes: 45
    permissions:
      contents: read # check out the repository
      security-events: read # CodeQL reads its feature flags and sends its status reports through code scanning's API; without this it would analyse with other defaults than the ones GitHub sets
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The full history: the Qt release-age check finds the commit that pinned the Qt version in deps/qt.json.
          fetch-depth: 0
          persist-credentials: false

      - name: Let git use the checkout, which belongs to the runner's user and not to the container's root
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # As in ci.yml: the same lock, cache key and folder, so the jobs share the cache.
      - name: Restore the Ubuntu package files from the cache
        id: ubuntu-packages-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ubuntu-packages
          key: ubuntu-packages-v1-${{ hashFiles('deps/ubuntu-packages.lock') }}

      - name: Fetch the Ubuntu package files that deps/ubuntu-packages.lock lists, each checked against its size and SHA-256
        run: sh scripts/ubuntu-packages.sh fetch --report "$RUNNER_TEMP/ubuntu-packages.report" deps/ubuntu-packages.lock "$RUNNER_TEMP/ubuntu-packages"

      - name: Save them in the cache (runs on main only), before any package is installed
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule') && steps.ubuntu-packages-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ubuntu-packages
          key: ubuntu-packages-v1-${{ hashFiles('deps/ubuntu-packages.lock') }}

      - name: Install the Ubuntu packages with dpkg, in apt's recorded order, without apt and without network
        run: sh scripts/ubuntu-packages.sh install --report "$RUNNER_TEMP/ubuntu-packages.report" deps/ubuntu-packages.lock "$RUNNER_TEMP/ubuntu-packages"

      - name: The pinned Qt release is at least 24 hours old (ADR-0017 rule 4), checked before Qt is installed and its tools run in the build
        run: python3 scripts/check-qt-release-age.py

      - name: Install pinned tools and Qt
        run: scripts/dev-setup.sh

      - name: Download the CodeQL bundle (pinned version, SHA-256 checked)
        run: |
          bundle="$RUNNER_TEMP/codeql-bundle-linux64.tar.zst"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 --output "$bundle" \
            "https://github.com/github/codeql-action/releases/download/codeql-bundle-v$CODEQL_VERSION/codeql-bundle-linux64.tar.zst"
          echo "$CODEQL_BUNDLE_SHA256  $bundle" | sha256sum --check --strict

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: c-cpp
          build-mode: manual
          tools: ${{ runner.temp }}/codeql-bundle-linux64.tar.zst

      - name: Build (the ci preset, as in ci.yml, without the tests)
        run: |
          cmake --preset ci
          cmake --build --preset ci

      # As in the analysis job above: the results go to a file for the upload job, and the database is not uploaded.
      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:c-cpp
          upload: never
          post-processed-sarif-path: ${{ runner.temp }}/codeql-sarif
          upload-database: false

      - name: Keep the results for the upload job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif-c-cpp
          path: ${{ runner.temp }}/codeql-sarif/upload.sarif
          if-no-files-found: error
          retention-days: 1

  cpp:
    name: CodeQL (c-cpp)
    needs: cpp-analysis
    # Also when the analysis failed: the first step then fails, so that the required check fails instead of being skipped.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the repository, which the upload uses to match the results to its files
      security-events: write # upload the results to code scanning
    defaults:
      run:
        shell: bash
    steps:
      - name: Stop unless the analysis succeeded
        env:
          RESULT: ${{ needs.cpp-analysis.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::The job \"CodeQL analysis (c-cpp)\" did not succeed (its result is $RESULT), so there are no results to upload."
            exit 1
          fi

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codeql-sarif-c-cpp
          path: ${{ runner.temp }}/codeql-sarif

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ runner.temp }}/codeql-sarif/upload.sarif
          category: /language:c-cpp
