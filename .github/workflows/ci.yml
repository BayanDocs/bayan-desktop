# Build, lint and test bayan-desktop on Linux, macOS and Windows (DESK-001), on every pull request, in the merge queue and on pushes to main.
# Every tool is pinned and verified: actions by full commit SHA, the build tools by exact version and hash (deps/), Qt by exact
# version through scripts/install-qt.py, which checks each archive against the SHA-256 published on download.qt.io (ADR-0017).
# The two Linux jobs run in a container from the base image that deps/ubuntu-packages.lock pins by digest (X-005; ADR-0017, amendment of
# 2026-11-05), so that a newer runner image cannot break the install of their Ubuntu packages. scripts/ubuntu-packages.sh puts the package
# files that the lock lists into a folder, each from the cache or else from the snapshot of Ubuntu's archive, Launchpad or the live archive,
# checked against the lock's size and SHA-256, and then installs them with dpkg in apt's recorded order, without apt and without network.
# Only runs on main save the folder in the cache (actions/cache), after the fetch and before the install, so it holds only checked files
# that no package's installation program has run beside. The job "Ubuntu packages lock" (ubuntu-packages.yml) checks the lock itself.
# Python is Ubuntu 24.04's Python 3 in the Linux containers and the runner image's own Python 3 on macOS and Windows, as in every other
# BayanDocs workflow, so nothing is downloaded for it; each job checks that it is 3.11 or newer, which scripts/dev-setup.sh and the tests
# need, and prints its version.
# scripts/dev-setup.sh does the installing, so CI uses exactly what developers and cloud sessions use. scripts/test-engine-sdk.sh checks, on every
# operating system, that the app also builds and passes its engine tests against a shared-library engine laid out like the bayan-core C SDK:
# a stand-in built from the stub engine, and the real engine, which scripts/build-engine-sdk.sh builds from the bayan-core commit pinned in
# deps/bayan-core.json (ADR-0002 §4, Phase 0) with the Rust version that commit pins, installed by rustup (Ubuntu's rustup package from the
# lock in the Linux containers, the runner image's own on macOS and Windows), and the crates of its Cargo.lock. The real engine's mock document is what the typing, input-method and accessibility tests of DESK-002 need.
# The sanitizer job runs every test against the stub engine under AddressSanitizer and UndefinedBehaviorSanitizer, and then the tests that use
# the engine against the real engine under them too (DESK-003), where the engine's thread calls the shell's callback.
name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux · verification gate
    runs-on: ubuntu-24.04
    # A container from the base image of deps/ubuntu-packages.lock (tests/ubuntu-packages/test_lock.py keeps them equal): Ubuntu 24.04 with
    # ca-certificates, curl and git. Its steps run as root, with bash.
    container:
      image: docker.io/library/buildpack-deps:noble-scm@sha256:94ed690dd634b8b2f531eaa742fde9b1264077cd8ea695a3b960bd104ae4c481 # created 2026-10-26T23:50:00Z
      # X-005 AC-5 (draft, not to be merged): snapshot.ubuntu.com points nowhere, so every file must come from Launchpad.
      options: --add-host snapshot.ubuntu.com:127.0.0.1
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The full history: the supply_chain.qt_release_age test finds the commit that pinned the Qt version in deps/qt.json.
          fetch-depth: 0
          persist-credentials: false
      - name: Let git use the checkout, which belongs to the runner's user and not to the container's root
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Restore the Ubuntu package files from the cache
        id: ubuntu-packages-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ubuntu-packages
          key: ubuntu-packages-v1-${{ hashFiles('deps/ubuntu-packages.lock') }}
      - name: Fetch the Ubuntu package files that deps/ubuntu-packages.lock lists, each checked against its size and SHA-256
        run: sh scripts/ubuntu-packages.sh fetch --report "$RUNNER_TEMP/ubuntu-packages.report" deps/ubuntu-packages.lock "$RUNNER_TEMP/ubuntu-packages"
      - name: Save them in the cache (runs on main only), before any package is installed
        # X-005 AC-7 (draft, not to be merged): this pull request saves the cache too, so that its second run restores it.
        if: ${{ steps.ubuntu-packages-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ubuntu-packages
          key: ubuntu-packages-v1-${{ hashFiles('deps/ubuntu-packages.lock') }}
      - name: Install the Ubuntu packages with dpkg, in apt's recorded order, without apt and without network
        run: sh scripts/ubuntu-packages.sh install --report "$RUNNER_TEMP/ubuntu-packages.report" deps/ubuntu-packages.lock "$RUNNER_TEMP/ubuntu-packages"
      - name: Use the container's Python 3 (Ubuntu 24.04's, 3.11 or newer; nothing is downloaded)
        run: |
          # Every python3 and python on PATH, in order, until one is 3.11 or newer: on Windows python3 can be the Microsoft Store's placeholder,
          # and on macOS Apple's /usr/bin/python3 is 3.9. The later steps, scripts/dev-setup.sh included, use the one found here ($PYTHON).
          while IFS= read -r candidate; do
            if "$candidate" -c 'import sys; sys.exit(sys.version_info < (3, 11))' 2>/dev/null; then
              "$candidate" -c 'import platform, sys; print("Python", platform.python_version(), "at", sys.executable)'
              echo "PYTHON=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
          done < <(type -ap python3 python)
          echo 'No Python 3.11 or newer on PATH' >&2
          exit 1
      - name: The pinned Qt release is at least 24 hours old (ADR-0017 rule 4), checked before Qt is installed and its tools run in the build
        run: '"$PYTHON" scripts/check-qt-release-age.py'
      - name: Install pinned tools and Qt
        run: scripts/dev-setup.sh
      - name: Verification gate (build, clang-format, clang-tidy, qmllint, tests, headless smoke test)
        run: cmake --workflow --preset verify
      - name: Engine SDK path (stub built as a stand-in SDK; build and engine tests with BAYAN_ENGINE=sdk)
        run: scripts/test-engine-sdk.sh
      - name: Build the bayan-core C SDK from the commit pinned in deps/bayan-core.json
        run: scripts/build-engine-sdk.sh
      - name: Real engine (CORE-007's mock document; build and engine tests with BAYAN_ENGINE=sdk, none of them skipped)
        env:
          BAYAN_REQUIRE_MOCK_DOCUMENT: '1'
        run: scripts/test-engine-sdk.sh --sdk build/bayan-core-sdk

  sanitizers:
    name: Linux · AddressSanitizer and UndefinedBehaviorSanitizer
    runs-on: ubuntu-24.04
    # A container from the base image of deps/ubuntu-packages.lock (tests/ubuntu-packages/test_lock.py keeps them equal): Ubuntu 24.04 with
    # ca-certificates, curl and git. Its steps run as root, with bash.
    container:
      image: docker.io/library/buildpack-deps:noble-scm@sha256:94ed690dd634b8b2f531eaa742fde9b1264077cd8ea695a3b960bd104ae4c481 # created 2026-10-26T23:50:00Z
      # X-005 AC-5 (draft, not to be merged): snapshot.ubuntu.com points nowhere, so every file must come from Launchpad.
      options: --add-host snapshot.ubuntu.com:127.0.0.1
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The full history: the supply_chain.qt_release_age test finds the commit that pinned the Qt version in deps/qt.json.
          fetch-depth: 0
          persist-credentials: false
      - name: Let git use the checkout, which belongs to the runner's user and not to the container's root
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Restore the Ubuntu package files from the cache
        id: ubuntu-packages-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ubuntu-packages
          key: ubuntu-packages-v1-${{ hashFiles('deps/ubuntu-packages.lock') }}
      - name: Fetch the Ubuntu package files that deps/ubuntu-packages.lock lists, each checked against its size and SHA-256
        run: sh scripts/ubuntu-packages.sh fetch --report "$RUNNER_TEMP/ubuntu-packages.report" deps/ubuntu-packages.lock "$RUNNER_TEMP/ubuntu-packages"
      - name: Save them in the cache (runs on main only), before any package is installed
        # X-005 AC-7 (draft, not to be merged): this pull request saves the cache too, so that its second run restores it.
        if: ${{ steps.ubuntu-packages-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ubuntu-packages
          key: ubuntu-packages-v1-${{ hashFiles('deps/ubuntu-packages.lock') }}
      - name: Install the Ubuntu packages with dpkg, in apt's recorded order, without apt and without network
        run: sh scripts/ubuntu-packages.sh install --report "$RUNNER_TEMP/ubuntu-packages.report" deps/ubuntu-packages.lock "$RUNNER_TEMP/ubuntu-packages"
      - name: Use the container's Python 3 (Ubuntu 24.04's, 3.11 or newer; nothing is downloaded)
        run: |
          # Every python3 and python on PATH, in order, until one is 3.11 or newer: on Windows python3 can be the Microsoft Store's placeholder,
          # and on macOS Apple's /usr/bin/python3 is 3.9. The later steps, scripts/dev-setup.sh included, use the one found here ($PYTHON).
          while IFS= read -r candidate; do
            if "$candidate" -c 'import sys; sys.exit(sys.version_info < (3, 11))' 2>/dev/null; then
              "$candidate" -c 'import platform, sys; print("Python", platform.python_version(), "at", sys.executable)'
              echo "PYTHON=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
          done < <(type -ap python3 python)
          echo 'No Python 3.11 or newer on PATH' >&2
          exit 1
      - name: The pinned Qt release is at least 24 hours old (ADR-0017 rule 4), checked before Qt is installed and its tools run in the build
        run: '"$PYTHON" scripts/check-qt-release-age.py'
      - name: Install pinned tools and Qt
        id: tools
        run: scripts/dev-setup.sh
      - name: Sanitizer build and tests (every test, against the stub engine)
        run: cmake --workflow --preset asan
      # The real engine's two steps run even when the stub's failed, so that every run reports both; the job fails if any step fails.
      - name: Build the bayan-core C SDK from the commit pinned in deps/bayan-core.json
        id: engine-sdk
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: scripts/build-engine-sdk.sh
      - name: Real engine under the sanitizers (CORE-007's mock document; build and engine tests with BAYAN_ENGINE=sdk, none of them skipped)
        if: ${{ !cancelled() && steps.engine-sdk.outcome == 'success' }}
        env:
          BAYAN_REQUIRE_MOCK_DOCUMENT: '1'
        run: scripts/test-engine-sdk.sh --sdk build/bayan-core-sdk --sanitizers

  macos:
    name: macOS (arm64) · build and test
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The full history: the supply_chain.qt_release_age test finds the commit that pinned the Qt version in deps/qt.json.
          fetch-depth: 0
          persist-credentials: false
      - name: Use the runner's own Python 3 (3.11 or newer; nothing is downloaded)
        run: |
          # Every python3 and python on PATH, in order, until one is 3.11 or newer: on Windows python3 can be the Microsoft Store's placeholder,
          # and on macOS Apple's /usr/bin/python3 is 3.9. The later steps, scripts/dev-setup.sh included, use the one found here ($PYTHON).
          while IFS= read -r candidate; do
            if "$candidate" -c 'import sys; sys.exit(sys.version_info < (3, 11))' 2>/dev/null; then
              "$candidate" -c 'import platform, sys; print("Python", platform.python_version(), "at", sys.executable)'
              echo "PYTHON=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
          done < <(type -ap python3 python)
          echo 'No Python 3.11 or newer on PATH' >&2
          exit 1
      - name: The pinned Qt release is at least 24 hours old (ADR-0017 rule 4), checked before Qt is installed and its tools run in the build
        run: '"$PYTHON" scripts/check-qt-release-age.py'
      - name: Install pinned tools and Qt
        run: scripts/dev-setup.sh
      - name: Build and test (including the headless smoke test)
        run: cmake --workflow --preset ci
      - name: Engine SDK path (stub built as a stand-in SDK; build and engine tests with BAYAN_ENGINE=sdk)
        run: scripts/test-engine-sdk.sh
      - name: Build the bayan-core C SDK from the commit pinned in deps/bayan-core.json
        run: scripts/build-engine-sdk.sh
      - name: Real engine (CORE-007's mock document; build and engine tests with BAYAN_ENGINE=sdk, none of them skipped)
        env:
          BAYAN_REQUIRE_MOCK_DOCUMENT: '1'
        run: scripts/test-engine-sdk.sh --sdk build/bayan-core-sdk

  windows:
    name: Windows (MSVC) · build and test
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The full history: the supply_chain.qt_release_age test finds the commit that pinned the Qt version in deps/qt.json.
          fetch-depth: 0
          persist-credentials: false
      - name: Use the runner's own Python 3 (3.11 or newer; nothing is downloaded)
        run: |
          # Every python3 and python on PATH, in order, until one is 3.11 or newer: on Windows python3 can be the Microsoft Store's placeholder,
          # and on macOS Apple's /usr/bin/python3 is 3.9. The later steps, scripts/dev-setup.sh included, use the one found here ($PYTHON).
          while IFS= read -r candidate; do
            if "$candidate" -c 'import sys; sys.exit(sys.version_info < (3, 11))' 2>/dev/null; then
              "$candidate" -c 'import platform, sys; print("Python", platform.python_version(), "at", sys.executable)'
              echo "PYTHON=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
          done < <(type -ap python3 python)
          echo 'No Python 3.11 or newer on PATH' >&2
          exit 1
      - name: The pinned Qt release is at least 24 hours old (ADR-0017 rule 4), checked before Qt is installed and its tools run in the build
        run: '"$PYTHON" scripts/check-qt-release-age.py'
      - name: Install pinned tools and Qt
        run: scripts/dev-setup.sh
      - name: Build the bayan-core C SDK from the commit pinned in deps/bayan-core.json
        # Before the MSVC developer environment is loaded: in it, Git Bash's own link.exe comes first on PATH and Rust would take it for the
        # MSVC linker, which Rust otherwise finds by itself.
        run: scripts/build-engine-sdk.sh
      - name: Set up the MSVC developer environment (x64)
        shell: pwsh
        run: |
          # Equivalent of the "x64 Native Tools Command Prompt": run vcvars64.bat and keep the environment it sets.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'No Visual Studio installation with the C++ x64 tools was found.' }
          $vcvars = Join-Path $installation 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          }
      - name: Build and test (including the headless smoke test)
        run: cmake --workflow --preset msvc
      - name: Engine SDK path (stub built as a stand-in SDK; build and engine tests with BAYAN_ENGINE=sdk)
        run: scripts/test-engine-sdk.sh
      - name: Real engine (CORE-007's mock document; build and engine tests with BAYAN_ENGINE=sdk, none of them skipped)
        env:
          BAYAN_REQUIRE_MOCK_DOCUMENT: '1'
        run: scripts/test-engine-sdk.sh --sdk build/bayan-core-sdk
